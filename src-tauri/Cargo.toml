[package]
name = "rpg-music-director"
version = "0.1.0"
description = "RPG Music Director — application desktop d'aide à la maîtrise pour les MJ de jeu de rôle, scénarisation musicale par graphe nodal et déclenchement multi-couches en partie"
authors = ["Jean-Philippe Mouton <J-PhM@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/J-PhM/rpg-music-director"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rpg_music_director_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

